<div id="start"><h1>ROBOT FIGHT</h1>
<p>兩人對戰 · 各用自己的電腦和相機，兩隻手控制一隻機器人
<b style="color:#f5c531">右手</b>管移動：踏步走 · 快踏跑 · 掌傾轉身 · 握拳退 · 抽高跳　　<b style="color:#f5c531">左手</b>管攻擊：握拳直拳 · 彈指踢 · 抽高上勾 · 張手防</p>
<button id="go">開房 · 我是 <span style="color:#a00">P1</span>（會要求相機）</button>
<p>對手開了房？輸入他的房號：<input id="code" maxlength="4" placeholder="ABCD"> <button id="joinBtn" class="alt">加入 · 我是 P2</button></p>
<p style="font-size:12px;opacity:.6">沒相機：<a href="?keys" style="color:#9fd6ff">鍵盤版</a>　看效果：<a href="?demo" style="color:#9fd6ff">電腦互打</a></p></div>

<script type="module">
import * as THREE from 'three';

// ---- 對戰設計表：右手 = 基本 + 移動 + 轉身，左手 = 攻擊招式 ----
// 每位玩家可選 手勢 / 鍵盤 / 電腦，三種來源都產生同一種 input 物件（fwd/back/left/right/run/jump/punch/kick/heavy/guard）
// ponytail: 鍵位一張表；手勢對應在下面 decide()
const KEYS = {
  P1: { fwd: 'KeyW', back: 'KeyS', left: 'KeyA', right: 'KeyD', run: 'ShiftLeft', jump: 'Space',           // 右手：移動 / 轉身
        punch: 'KeyF', kick: 'KeyG', heavy: 'KeyH', guard: 'KeyR' },                                          // 左手：攻擊
  P2: { fwd: 'ArrowUp', back: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', run: 'ShiftRight', jump: 'Enter',
        punch: 'KeyI', kick: 'KeyO', heavy: 'KeyP', guard: 'KeyL' },
};
const HELP = (n, k) => `${n}  右手（移動）${k.fwd.replace('Key', '')} ${k.left.replace('Key', '')} ${k.back.replace('Key', '')} ${k.right.replace('Key', '')} 走/轉身  ${k.run.replace('Left', '').replace('Right', '')} 跑  ${k.jump} 跳
${' '.repeat(n.length)}  左手（攻擊）${k.punch.replace('Key', '')} 直拳  ${k.kick.replace('Key', '')} 踢  ${k.heavy.replace('Key', '')} 上勾重拳  ${k.guard.replace('Key', '')} 防禦`;

const SPEED = { walk: 1.6, run: 3.8, turn: 2.6, back: 1.1 };   // m/s、rad/s
const ROOM = 7;                                                // 方形房間半寬 (m)
const OBST = [{ x: 3.2, z: 3.2, w: 1, d: 1, h: 3 }, { x: -3.2, z: -3.2, w: 1, d: 1, h: 3 }, { x: -3.2, z: 3.2, w: 1, d: 1, h: 3 }, { x: 3.2, z: -3.2, w: 1, d: 1, h: 3 },
              { x: 0, z: -4.6, w: 1.8, d: .8, h: .9 }, { x: 0, z: 4.6, w: 1.8, d: .8, h: .9 }];   // 柱子 / 矮箱：會擋人（AABB）
function collide(p, r = .35) {                                 // 把腳底位置推出牆和障礙物
  p.x = clamp(p.x, -ROOM + r, ROOM - r); p.z = clamp(p.z, -ROOM + r, ROOM - r);
  for (const o of OBST) { const dx = p.x - o.x, dz = p.z - o.z, px = o.w / 2 + r - Math.abs(dx), pz = o.d / 2 + r - Math.abs(dz);
    if (px > 0 && pz > 0) { if (px < pz) p.x += Math.sign(dx || 1) * px; else p.z += Math.sign(dz || 1) * pz; } }
  return p;
}
const lerp = (a, b, w) => a + (b - a) * w;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = p => p * p * (3 - 2 * p);

// 姿勢表（角度 rad；鍵 = 關節名，'_z' = 繞 z 軸）。肩 +x = 手往前抬、髖 +x = 腿往前、膝負 = 正常彎
const STANCE = { shoulderL: .5, elbowL: 1.5, shoulderR: .3, elbowR: 1.6, shoulderL_z: -.25, shoulderR_z: .25, hipL: .15, hipR: .15, kneeL: -.3, kneeR: -.3, torso_y: .25 };
const GUARD  = { shoulderL: .9, elbowL: 2.2, shoulderR: .9, elbowR: 2.2, shoulderL_z: -.3, shoulderR_z: .3, hipL: .25, hipR: .25, kneeL: -.5, kneeR: -.5, neck_x: .25 };
const HIT    = { neck_x: -.45, shoulderL: -.6, shoulderR: -.6, elbowL: .8, elbowR: .8, hipL: .3, hipR: .3, kneeL: -.5, kneeR: -.5 };
const TUCK   = { hipL: .7, hipR: .7, kneeL: -1.3, kneeR: -1.3, shoulderL: 2.4, shoulderR: 2.4, elbowL: .3, elbowR: .3 };
const KO     = { shoulderL: 2.6, shoulderR: 2.6, shoulderL_z: -.6, shoulderR_z: .6, elbowL: .3, elbowR: .3, hipL: .2, hipR: -.1, kneeL: -.4, kneeR: -.2, neck_x: .3 };
const GAIT = { walk: { hip: .45, knee: .9, arm: .5, elbow: .35, lean: 0 }, run: { hip: .8, knee: 1.6, arm: .9, elbow: 1.3, lean: .25 } };
function gaitPose(phi, w) {
  const g = Object.fromEntries(Object.keys(GAIT.walk).map(k => [k, lerp(GAIT.walk[k], GAIT.run[k], w)]));
  const s = Math.sin(phi), c = Math.cos(phi);
  return { hipL: g.hip * s, hipR: -g.hip * s, kneeL: -g.knee * Math.max(0, c), kneeR: -g.knee * Math.max(0, -c),
           ankleL: .25 * s, ankleR: -.25 * s, shoulderL: -g.arm * s, shoulderR: g.arm * s, elbowL: g.elbow, elbowR: g.elbow, lean: g.lean };
}
// 招式表：dur 毫秒、hit = 判定點 (進度 0~1，過了就打一次)、reach 距離、kb 擊退、lunge 出招時往前衝。pose(p) 回傳該進度的姿勢
// ponytail: 加招式只動這張表 + KEYS
const ATTACKS = {
  punch: { dur: 380, hit: .3, dmg: 8, reach: 1.25, kb: 1.6, stun: 300, lunge: .9,
           pose: () => ({ shoulderR: 1.6, elbowR: .1, shoulderR_z: .2, shoulderL: -.3, elbowL: 1.6, shoulderL_z: -.3, torso_y: -.5, neck_y: .4 }) },
  kick:  { dur: 560, hit: .35, dmg: 12, reach: 1.5, kb: 2.6, stun: 420, lunge: .4,
           pose: p => ({ hipR: 1.7, kneeR: -1.3 * (1 - p), ankleR: -.4, hipL: -.25, kneeL: -.2, torso_y: -.3, shoulderL: .8, shoulderR: -.5, shoulderL_z: -.5 }) },
  heavy: { dur: 780, hit: .45, dmg: 18, reach: 1.15, kb: 3.2, stun: 650, lunge: .5, launch: 3.2,
           pose: p => { const w = smooth(clamp((p - .3) / .25, 0, 1));                                // 前 30% 蹲蓄力，再一口氣上勾
             const a = { hipL: 1, hipR: 1, kneeL: -1.6, kneeR: -1.6, ankleL: .6, ankleR: .6, shoulderR: -.7, elbowR: 1.9, shoulderR_z: .2, torso_y: .5, neck_x: .2 };
             const b = { hipL: .2, hipR: .2, kneeL: -.3, kneeR: -.3, ankleL: 0, ankleR: 0, shoulderR: 2.9, elbowR: .5, shoulderR_z: .1, torso_y: -.6, neck_x: -.3, shoulderL: -.4, elbowL: 1.2 };
             return Object.fromEntries(Object.keys(a).map(k => [k, lerp(a[k], b[k], w)])); } },
};
const facing = yaw => new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));   // 機器人本體面向 -z
// 打不打得到：距離在 reach 內 + 對手在正前方 ±60°。回傳傷害（防禦且面對攻擊者 → 1/4）
function resolveHit(att, def, atk) {
  const to = def.root.position.clone().sub(att.root.position); const d = to.length(); if (d > atk.reach) return 0;
  const f = facing(att.yaw); if (f.dot(to) / (d || 1e-9) < .5) return 0;
  const blocked = def.guard > .5 && facing(def.yaw).dot(to) < 0;
  return blocked ? Math.round(atk.dmg / 4) : atk.dmg;
}

// ---- 手勢層：右手 = 移動 / 轉身，左手 = 攻擊。手勢只產生跟鍵盤一樣的 input，走路動畫固定用 gaitPose ----
// ponytail: 訊號函式從 index.html 複製過來（signals / handShape / makeGaitDetector 一字不改）；兩邊要同步改再抽成模組
const FINGER = { thumb: [1, 2, 3, 4], index: [5, 6, 7, 8], middle: [9, 10, 11, 12], ring: [13, 14, 15, 16], pinky: [17, 18, 19, 20] };
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: (a.z || 0) - (b.z || 0) });
const vlen = v => Math.hypot(v.x, v.y, v.z);
const between = (u, v) => Math.acos(clamp((u.x * v.x + u.y * v.y + u.z * v.z) / (vlen(u) * vlen(v) || 1e-9), -1, 1));
const ang = (a, b, c) => { const u = sub(a, b), v = sub(c, b), n = vlen(u) * vlen(v); return n < 1e-9 ? 0 : Math.PI - Math.acos(clamp((u.x * v.x + u.y * v.y + u.z * v.z) / n, -1, 1)); };
const flex = (lm, f) => ({ mcp: ang(lm[0], lm[f[0]], lm[f[1]]), pip: ang(lm[f[0]], lm[f[1]], lm[f[2]]), dip: ang(lm[f[1]], lm[f[2]], lm[f[3]]) });
function signals(h) {                                    // 一隻手的所有訊號：每指三關節彎曲、spread 張開角、tilt 左右傾
  const w = h.world, i = h.img, o = {};
  for (const f in FINGER) o[f] = flex(w, FINGER[f]);
  const uw = sub(w[9], w[0]), vw = sub(w[5], w[17]);
  const nx = uw.y * vw.z - uw.z * vw.y, ny = uw.z * vw.x - uw.x * vw.z, nz = uw.x * vw.y - uw.y * vw.x, nl = Math.hypot(nx, ny, nz) || 1e-9;
  const proj = a => { const d = (a.x * nx + a.y * ny + a.z * nz) / (nl * nl); return { x: a.x - d * nx, y: a.y - d * ny, z: a.z - d * nz }; };
  const pi = proj(sub(w[6], w[5])), pm = proj(sub(w[10], w[9]));
  o.spread = vlen(pi) < .3 * vlen(sub(w[6], w[5])) || vlen(pm) < .3 * vlen(sub(w[10], w[9])) ? 0 : between(pi, pm);
  const u = sub(i[9], i[0]); o.tilt = Math.atan2(u.x, Math.abs(u.y) || 1e-9);   // 原始影像 x 小 = 使用者右邊；往右傾 → tilt < 0
  return o;
}
function handShape(s) {
  const ext = f => s[f].pip < .45 && s[f].mcp < .7, curl = f => s[f].pip > 1.0, four = ['index', 'middle', 'ring', 'pinky'];
  const thumbExt = s.thumb.pip + s.thumb.dip < .7;
  if (four.every(ext) && s.spread > .3) return 'OPEN';
  if (four.every(curl)) return thumbExt ? 'THUMB' : 'FIST';
  if (ext('index') && ['middle', 'ring', 'pinky'].every(curl)) return 'POINT';
  return '';
}
function makeGaitDetector(th = 0.12, windowMs = 1500, holdMs = 900) {   // 食指 − 中指 MCP 彎曲正負換邊 = 一步
  let side = 0; const steps = [];
  return (s, t) => {
    const ns = s > th ? 1 : s < -th ? -1 : 0;
    let stepped = 0;
    if (ns && ns !== side) { if (side) { steps.push(t); stepped = ns; } side = ns; }
    while (steps.length && t - steps[0] > windowMs) steps.shift();
    const n = steps.length, active = n >= 2 && t - steps[n - 1] < holdMs;
    return { active, stepped, cadence: active ? (n - 1) * 1000 / (steps[n - 1] - steps[0]) : 0 };
  };
}
const RUN_CADENCE = 4.2, JUMP_LIFT = .8, KICK_DROP = .5, TURN_DEAD = .21;   // 門檻跟 index.html 一樣：步/秒、手長/0.25 s、rad/0.2 s、rad
function makeRise(cool = 1000) {                          // 一次型：手腕 0.25 s 內往上抽 JUMP_LIFT 個手長
  let trail = [], last = -1e9;
  return (y, hl, now) => { trail.push({ y, t: now }); while (now - trail[0].t > 250) trail.shift();
    if (trail.length > 1 && (trail[0].y - y) / hl > JUMP_LIFT && now - last > cool) { last = now; trail = []; return true; } return false; };
}
function makeFlick(cool = 800) {                          // 一次型：食指或中指 MCP 0.2 s 內彈直掉 KICK_DROP
  const tr = { index: [], middle: [] }; let last = -1e9;
  return (s, now) => { let hit = false;
    for (const f of ['index', 'middle']) { const t = tr[f]; t.push({ v: s[f].mcp, t: now }); while (now - t[0].t > 200) t.shift();
      if (t.length > 1 && t[0].v - s[f].mcp > KICK_DROP && now - last > cool) { last = now; hit = true; } }
    return hit; };
}
function makeHold(ms = 200) {                             // 手型撐 ms 才算數；edge = 這一 frame 剛成立（出拳只出一次）
  let cand = '', since = 0, name = '';
  return (shape, now) => { if (shape !== cand) { cand = shape; since = now; } const prev = name; if (now - since > ms) name = shape; return { name, edge: !!name && name !== prev }; };
}
const makeGesture = () => ({ gait: makeGaitDetector(), riseR: makeRise(), riseL: makeRise(), flick: makeFlick(), holdR: makeHold(), holdL: makeHold(), label: '' });
const handInfo = h => ({ s: signals(h), y: h.img[0].y, hl: Math.hypot(h.img[9].x - h.img[0].x, h.img[9].y - h.img[0].y) || 1e-3 });
// L / R = handInfo() 或 null → 跟 KEYS 版一樣的 input。ponytail: 改手勢對應只動這裡
function decide(g, L, R, now) {
  const I = {}, tag = [];
  if (R) {   // 右手：食/中指踏步 = 走（≥ RUN_CADENCE 跑）、手掌左右傾 = 轉身、握拳 = 退、整手往上抽 = 跳
    const s = R.s, det = g.gait(s.index.mcp - s.middle.mcp, now), shape = g.holdR(handShape(s), now).name;
    I.fwd = det.active; I.run = det.cadence >= RUN_CADENCE; I.back = !det.active && shape === 'FIST';
    I.left = s.tilt > TURN_DEAD; I.right = s.tilt < -TURN_DEAD; I.jump = g.riseR(R.y, R.hl, now);
    tag.push('右 ' + (I.jump ? '跳' : I.run ? '跑' : I.fwd ? '走' : I.back ? '退' : I.left ? '左轉' : I.right ? '右轉' : '—'));
  } else tag.push('右 ✗');
  if (L) {   // 左手：握拳 = 直拳、一指快速彈直 = 踢、整手往上抽 = 上勾重拳、五指張開 = 防禦
    const s = L.s, h = g.holdL(handShape(s), now);
    I.punch = h.name === 'FIST' && h.edge; I.kick = g.flick(s, now); I.heavy = g.riseL(L.y, L.hl, now); I.guard = h.name === 'OPEN';
    tag.push('左 ' + (I.heavy ? '上勾' : I.kick ? '踢' : I.punch ? '拳' : I.guard ? '防' : '—'));
  } else tag.push('左 ✗');
  g.label = tag.join('  '); return I;
}

// ---- 3D 場景 ----
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true });
const LITE = new URLSearchParams(location.search).has('lite');
renderer.setPixelRatio(LITE ? 1 : devicePixelRatio); renderer.shadowMap.enabled = !LITE;
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x15151c, 8, 30);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xbfb8ff, 0x201c40, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.position.set(-3, 9, -3); scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(60, 60, 0x7a6fe0, 0x2e2a5a));
// 房間：反面渲染的大箱子（從外面看是透明的，側面攝影機不會被牆擋）+ 牆頂霓虹條 + 柱子 / 矮箱
const room = new THREE.Mesh(new THREE.BoxGeometry(ROOM * 2, 4.5, ROOM * 2), new THREE.MeshStandardMaterial({ color: 0x1d1f33, roughness: .9, side: THREE.BackSide }));
room.position.y = 2.25; room.receiveShadow = true; scene.add(room);
const neon = new THREE.MeshBasicMaterial({ color: 0x7a6fe0 });
for (const [x, z, w, d] of [[0, -ROOM, ROOM * 2, .06], [0, ROOM, ROOM * 2, .06], [-ROOM, 0, .06, ROOM * 2], [ROOM, 0, .06, ROOM * 2]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, .06, d), neon); m.position.set(x, 3.2, z); scene.add(m);
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, .04, d), new THREE.MeshBasicMaterial({ color: 0xf5c531 })); b.position.set(x, .02, z); scene.add(b);   // 地板邊線
}

// ---- 攝影機：連線時 = 第三人稱跟在自己機器人後面（tps），對手不在畫面內時下方箭頭指過去；單機 / demo = 兩人連線的側面（side）。?cam=tps|side 強制 ----

}
// ---- 連線：PeerJS（WebRTC 點對點，信令走 peerjs 公共伺服器，所以放靜態網站就能跑）----
// 先開的人 = P1 主機：拿到 4 碼房號、跑整個模擬、30 Hz 送畫面狀態；P2 輸入房號加入，只送自己的 input、照主機的狀態畫
// ponytail: 沒做預測 / 插補，同 Wi-Fi 一鍵到對手畫面約 20~50 ms；沒 TURN，對稱 NAT 後面可能連不上
const NET = { p: 0, code: '', conn: null, ready: false, remote: {}, remoteAt: -1e9, state: null, stateAt: -1e9, acc: {}, hits: 0, wantReset: false, resetSeq: 0, resetSeen: 0, err: '' };
const PEER_NS = 'robotfight-';
const randomCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random() * 24 | 0]).join('');
function mkPeer(id) {
  const p = id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 });
  p.on('error', e => { NET.err = { 'peer-unavailable': '找不到這個房號', 'unavailable-id': '房號被占用，重新整理再開一次', 'network': '連不到信令伺服器' }[e.type] || e.type; console.warn(e); });
  addEventListener('pagehide', () => p.destroy());
  return p;
}
function host(code) {
  NET.p = 1; NET.code = code; const p = mkPeer(PEER_NS + code); p.on('open', () => NET.ready = true);
  p.on('connection', c => { NET.conn = c; c.on('data', d => { NET.remote = d; NET.remoteAt = performance.now(); }); c.on('close', () => { if (NET.conn === c) NET.conn = null; }); });
}
function guest(code) {
  NET.p = 2; NET.code = code; const p = mkPeer();
  const dial = () => {                                     // 8 秒沒接通就重撥（信令 / ICE 偶爾第一次會卡住）
    const c = p.connect(PEER_NS + code, { serialization: 'json' }); NET.tries = (NET.tries || 0) + 1;
    c.on('open', () => { NET.conn = c; NET.ready = true; NET.err = ''; });
    c.on('data', d => { NET.state = d; NET.stateAt = performance.now(); }); c.on('close', () => { if (NET.conn === c) { NET.conn = null; NET.err = '對手斷線'; } });
    setTimeout(() => { if (!c.open && !p.destroyed) { c.close(); dial(); } }, 8000);
  };
  p.on('open', dial);
}
let lastPub = 0;
function send(obj) {                                       // 30 Hz 節流；P2 的一次型 input（拳/踢/跳）用 OR 累積，不會因為跳過的 frame 掉招
  if (NET.p === 2) for (const k in obj) NET.acc[k] = NET.acc[k] || obj[k];
  if (!NET.conn || performance.now() - lastPub < 33) return; lastPub = performance.now();
  try { NET.conn.send(NET.p === 1 ? obj : NET.acc); } catch (e) { console.warn(e); } NET.acc = {};
}
function snapshot() {
  return { f: fighters.map(f => ({ p: f.root.position.toArray().map(r3), r: [r3(f.root.rotation.x), r3(f.root.rotation.y)], a: ANGLES.map(k => r3(f.angle[k])),
                                    t: [r3(f.torso.rotation.x), r3(f.torso.position.y), r3(f.pelvis.rotation.z)], hp: f.hp })), m: $('msg').textContent, h: hitCount, fx: lastHit };
}
function applySnapshot(s) {
  s.f.forEach((d, i) => { const f = fighters[i]; f.root.position.fromArray(d.p); f.root.rotation.set(d.r[0], d.r[1], 0); ANGLES.forEach((k, j) => f.angle[k] = d.a[j]); applyJoints(f);
    f.torso.rotation.x = d.t[0]; f.torso.position.y = d.t[1]; f.pelvis.rotation.z = d.t[2]; f.hp = d.hp; });
  msg(s.m);
  if (s.h !== NET.hits) { NET.hits = s.h; if (s.fx) { spark(new THREE.Vector3().fromArray(s.fx.p), s.fx.big); shake = s.fx.big ? .3 : .12; } }
}
function netStatus(now) {
  if (!NET.p) return SRC === 'ai' ? 'ROBOT FIGHT · 電腦互打' : 'ROBOT FIGHT';
  const err = NET.err ? ` · ${NET.err}` : '';
  if (NET.p === 1) return `房號 ${NET.code} · ${now - NET.remoteAt < 1000 ? '對手已連線' : NET.ready ? '等對手輸入房號… 先由電腦代打' : '連線中…'}${err}`;
  return `房號 ${NET.code} · ${now - NET.stateAt < 1000 ? '已連線（你是 P2 綠）' : `連線中…${NET.tries > 1 ? `（第 ${NET.tries} 次）` : ''}`}${err}`;
}
function goOnline() {                                      // 開房 or 加入；?room=XXXX 指定房號、?join=XXXX 直接加入
  const j = ($('code').value || Q.get('join') || '').trim().toUpperCase();
  if (j.length === 4) guest(j); else host((Q.get('room') || randomCode()).toUpperCase());
  if (SRC === 'key') { $('k1').textContent = HELP(`你 = P${NET.p}`, KEYS.P1); $('k2').hidden = true; }
}
async function begin(btn) { for (const b of ['go', 'joinBtn']) $(b).disabled = true; btn.textContent = '相機載入中…'; await startCamera(); goOnline(); $('start').hidden = true; reset(); }
$('go').onclick = () => { $('code').value = ''; begin($('go')); };
$('joinBtn').onclick = () => { if ($('code').value.trim().length === 4) begin($('joinBtn')); else $('code').focus(); };
$('code').value = Q.get('join') || '';
if (SRC !== 'hand') { $('start').hidden = true; setSrc(SRC); if (SRC === 'key') goOnline(); }
function msg(s) { $('msg').textContent = s; $('msg').style.opacity = s ? 1 : 0; }
function reset() {
  for (const f of fighters) { Object.assign(f, { hp: 100, yaw: f.yaw0, act: null, guard: 0, stun: 0, hitW: 0, ko: 0, turnLean: 0 }); f.jump = { y: 0, vy: 0, air: 0 }; f.kb.set(0, 0, 0); f.root.position.set(f.x0, 0, 0); }
  msg('FIGHT'); setTimeout(() => msg(''), 900);
}
function resize() { const W = innerWidth, H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); reset();

let last = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  readHands(now);
  const started = $('start').hidden, status = [];
  const localInput = f => { if (SRC === 'key') return readKeys(f, NET.p ? KEYS.P1 : KEYS[f.name]);
    const { L, R } = playerHands(); const I = decide(f.g, L && handInfo(L), R && handInfo(R), now); status.push(f.g.label); return I; };
  if (NET.p === 2) {                                       // 客戶端：送自己的 input、畫主機送來的狀態
    const I = started ? localInput(P2) : {}; if (NET.wantReset) { I.reset = ++NET.resetSeq; NET.wantReset = false; }
    send(I); if (NET.state) applySnapshot(NET.state);
  } else {
    for (const [f, opp] of [[P1, P2], [P2, P1]]) {
      const remote = f === P2 && NET.p === 1 && now - NET.remoteAt < 1000;   // 主機：P2 的 input 從對手的瀏覽器來
      if (f.ko || !started) f.input = {};
      else if (remote) { f.input = NET.remote; if (NET.remote.reset && NET.remote.reset !== NET.resetSeen) { NET.resetSeen = NET.remote.reset; reset(); } }
      else if (SRC === 'ai' || (f === P2 && (NET.p === 1 || SRC === 'hand'))) aiThink(f, opp, now);   // 對手還沒進來 → 電腦代打
      else f.input = localInput(f);
    }
    updateFighter(P1, P2, dt, now); updateFighter(P2, P1, dt, now);
    if (NET.p === 1) send(snapshot());
  }
  $('mid').textContent = netStatus(now);
  drawHands(); $('hands').textContent = camNote || status.join('\n');
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.t += dt * 4; s.m.scale.setScalar(1 + s.t * 2.5); s.m.material.opacity = 1 - s.t; s.m.position.y += dt * .6;
    if (s.t >= 1) { scene.remove(s.m); sparks.splice(i, 1); } }
  followCam(dt);
  $('b1').firstElementChild.style.transform = `scaleX(${P1.hp / 100})`; $('b2').firstElementChild.style.transform = `scaleX(${P2.hp / 100})`;
  $('b1').lastElementChild.textContent = `P1  ${P1.hp}`; $('b2').lastElementChild.textContent = `${P2.hp}  P2`;
  renderer.render(scene, camera);
}
// 分頁在背景時 rAF 完全不跑（連第一次都不會），主機一停對手畫面就凍住 → 背景改用 setTimeout 30 Hz；
// 可見性一變就換一代重新起跑，舊的那條鏈（卡在 rAF 或 timeout 裡的）看到代數不對就自己結束
let loopGen = 0;
function tick(now, gen) { if (gen !== loopGen) return; frame(now); if (document.hidden) setTimeout(() => tick(performance.now(), gen), 33); else requestAnimationFrame(t => tick(t, gen)); }
function startLoop() { loopGen++; tick(performance.now(), loopGen); }
document.addEventListener('visibilitychange', startLoop); startLoop();
Object.assign(window, { __P1: P1, __P2: P2, __hit: hitFighter, __ATTACKS: ATTACKS, __setHands: h => { hands = assign(h); }, __setSrc: setSrc, __NET: NET, __decide: decide, __handInfo: handInfo, __playerHands: playerHands });   // 除錯 / 驗證用（__setHands：沒相機時塞假手）

// ---- 自我檢查：命中幾何 + 防禦減傷 ----
{
  const mk = (x, z, yaw, guard = 0) => ({ root: { position: new THREE.Vector3(x, 0, z) }, yaw, guard });
  const A = mk(0, 0, 0);                                                   // 站原點，面向 -z
  const ok = resolveHit(A, mk(0, -1, Math.PI), ATTACKS.punch) === 8       // 正前方 1 m，面對面 → 打中
          && resolveHit(A, mk(0, 1, 0), ATTACKS.punch) === 0              // 在背後 → 沒打到
          && resolveHit(A, mk(0, -3, Math.PI), ATTACKS.kick) === 0        // 太遠
          && resolveHit(A, mk(0, -1, Math.PI, 1), ATTACKS.punch) === 2    // 面對我防禦 → 1/4
          && resolveHit(A, mk(0, -1, 0, 1), ATTACKS.punch) === 8;         // 背對我防禦 → 沒用
  console.assert(ok, 'resolveHit broken');
  // 手勢 → input：右手 2 Hz 踏步 → 走；掌傾 → 左轉；左手握拳 → 拳只出一次；張手 → 防；抽高 → 上勾
  const g = makeGesture(), H = (s, y = .5) => ({ s, y, hl: .2 });
  const sig = (pip, mcp, spread, tilt = 0, thumb = { mcp: .1, pip: .1, dip: .1 }) =>
    ({ thumb, index: { mcp, pip, dip: .1 }, middle: { mcp, pip, dip: .1 }, ring: { mcp, pip, dip: .1 }, pinky: { mcp, pip, dip: .1 }, spread, tilt });
  let I1; for (let i = 0; i <= 40; i++) { const s = sig(.5, .5, .1); s.index.mcp = .5 + .3 * Math.sin(2 * Math.PI * 2 * i * 33 / 1000); I1 = decide(g, null, H(s), i * 33); }
  let punches = 0, I2; for (let i = 0; i < 15; i++) { I2 = decide(g, H(sig(1.3, .8, 0, 0, { mcp: .5, pip: .6, dip: .4 })), H(sig(.2, .3, .4, .4)), 3000 + i * 33); punches += I2.punch ? 1 : 0; }
  decide(g, H(sig(.2, .3, .4)), null, 4000); const I3 = decide(g, H(sig(.2, .3, .4)), null, 4300);
  decide(g, H(sig(.5, .5, .1), .8), null, 5000); const I4 = decide(g, H(sig(.5, .5, .1), .5), null, 5100);
  const gOk = I1.fwd && !I1.run && !I2.fwd && I2.left && !I2.right && punches === 1 && I3.guard && !I3.punch && I4.heavy;
  console.assert(gOk, 'gesture decide broken', { I1, I2, punches, I3, I4 });
  if (ok && gOk) console.log('self-check ok');
}
